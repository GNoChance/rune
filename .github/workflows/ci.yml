name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  typecheck-ts6:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --workspace-concurrency=1 exec pnpm dlx --package=typescript@^6 tsc --noEmit -p tsconfig.json

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Historique complet, branches comprises : la règle 8 de data:validate lit origin/main.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Catalogue d'exercices et modèles de programmes (04 §13, critère 1 ; 05 §5), en strict : chaque code de
      # matériel est utilisé (R-EQ-5). Règle 8 : un modèle dont le contenu diffère de celui d'origin/main a une
      # version plus haute. Une référence --base absente fait échouer l'étape ; sur un push vers main, origin/main
      # est le commit lui-même et la règle n'a rien à comparer.
      - run: pnpm data:validate --strict --base origin/main
      # Fichiers d'illustrations : 40 Ko au plus, type vérifié par les octets, SVG nettoyés et crédités (04 §12).
      - run: pnpm svg:check
      - run: pnpm test

  # R-TST-1 : E2E Chromium (Pixel 7) et WebKit (iPhone 14), bloquant ; WebKit avec service worker fait foi ici.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @rune/web exec playwright install --with-deps chromium webkit
      - run: pnpm --filter @rune/web test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  # Scripts hôte (R-TST-1, bloquant) : shellcheck puis bats, toutes les commandes de l'hôte en stubs.
  infra:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: shellcheck -x infra/host/rune-* infra/host/lib/common.sh infra/host/test/stub.sh infra/test/image-contract.sh
      # Noms de tests en français : bats exige une locale UTF-8.
      - run: pnpm test:infra
        env:
          LC_ALL: C.UTF-8

  # Image de production (R-TST-1, bloquant) : construite depuis la racine, puis son contrat (08 §4) vérifié.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f infra/Dockerfile --build-arg VERSION=v0.0.0-ci -t rune:ci .
      - run: bash infra/test/image-contract.sh rune:ci v0.0.0-ci
